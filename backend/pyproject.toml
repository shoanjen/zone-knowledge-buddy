[project]
name = "zone-knowledge-buddy-backend"
version = "0.1.0"
description = "基于大模型 Agent 的多格式个人知识管理系统 - 后端"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "markdown-it-py>=3.0",
    "trafilatura>=1.8",
    "playwright>=1.45",
    "jinja2>=3.1",
    "python-ulid>=2.6",
    "jsonschema>=4.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() 参数默认值是官方惯用法

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
